name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App (Ubuntu 24.04 x64, Node 24.15.0)
    # Match the deployment server: Ubuntu 24.04 LTS / x86_64.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v4
        id: pnpm
      - name: Locate pnpm content store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-11.25.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-11.25.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            modules/greeks/requirements.lock
            modules/aster/requirements.lock
      - run: pnpm install --frozen-lockfile
      - name: Verify module selection, cache relocation and incremental type errors
        run: node --test --test-concurrency=2 deploy/test-module-builds.mjs deploy/test-typecheck-cache.mjs
      - name: Check and build with immutable dependencies as the service account
        run: |
          pip_cache="$(python -m pip cache dir)"
          sudo env INSTALL_TEST_PACKAGE=1 INSTALL_TEST_NODE="$(command -v node)" INSTALL_TEST_PNPM="${{ steps.pnpm.outputs.dest }}/node_modules/pnpm/bin/pnpm.mjs" INSTALL_TEST_PYTHON="$(command -v python)" INSTALL_TEST_PIP_CACHE="$pip_cache" bash deploy/test-workspace.sh
      - name: Keep the verified deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-x64
          path: output/release/*
          if-no-files-found: error
          # The runtime tarball is already gzip-compressed.
          compression-level: 0
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check release download, integrity, extraction and cache boundaries
        run: |
          python3 deploy/test-release.py -v
          python3 deploy/test-source-fetch.py -v
          sudo python3 deploy/test-release-download.py -v
          sudo python3 deploy/test-release-mirror.py -v
          python3 deploy/test-publish.py -v
          python3 deploy/test-promote.py -v
          python3 deploy/test-migration.py -v
          python3 deploy/test-package-layout.py -v
          python3 deploy/test-build-artifact-cache.py -v
          sudo env RUNTIME_LOCK_TEST_NODE="$(command -v node)" python3 -I deploy/test-runtime-lock-parser.py -v
      - name: Check installer syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/install-all.sh
          bash -n deploy/test-update-service.sh
          bash -n deploy/test-update-systemd.sh
          bash -n deploy/test-all.sh
          bash -n deploy/test-install.sh
          bash -n deploy/test-environment.sh
          bash -n deploy/test-inputs.sh
          bash -n deploy/test-incremental.sh
          bash -n deploy/test-workspace.sh
          bash -n deploy/workspace-test-jobs.sh
          bash -n deploy/test-workspace-parallel.sh
          bash -n deploy/test-module-incremental.sh
          bash -n deploy/test-mirror-performance.sh
          bash -n deploy/one-click-optimize.sh
          bash -n deploy/setup-release-mirror.sh
          bash -n deploy/configure-release-mirror.sh
          bash -n test-download-speed.sh
      - name: Verify parallel workspace failures and process cleanup
        run: bash deploy/test-workspace-parallel.sh
      - name: Verify privileged update coordinator and service bootstrap
        run: |
          sudo python3 deploy/test-updater.py -v
          sudo python3 deploy/test-progress.py -v
          sudo python3 deploy/test-release-progress.py -v
          python3 deploy/test-release-cache.py -v
          sudo bash deploy/test-update-service.sh
          sudo env AGG_UPDATER_DISPOSABLE_CI=1 GITHUB_ACTIONS=true bash deploy/test-update-systemd.sh
      - name: Check configuration, atomic activation, cleanup boundaries, and rollback
        run: bash deploy/test-install.sh
      - name: Classify real git inputs including compiler and build environment
        run: bash deploy/test-inputs.sh
      - name: Verify privileged Python dependency provenance
        run: sudo bash deploy/test-python-lock.sh
      - name: Verify incremental changes, isolated validation and recovery
        run: |
          sudo bash deploy/test-incremental.sh
          sudo bash deploy/test-module-incremental.sh
      - name: Verify CI package migration, no-op, integrity and rollback
        run: sudo bash deploy/test-ci-install.sh
      - name: Verify failed configuration changes restore the previous port
        run: bash deploy/test-environment.sh
      - name: Check stack caching, dependency batching, failure recovery and signals
        run: sudo bash deploy/test-all.sh
      - name: Check CI stack preflight and selected release pinning
        run: sudo bash deploy/test-stack-ci.sh

  aster-relay:
    name: Aster relay (Ubuntu 26.04 system Python)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare privileged installation paths on the disposable runner
        run: |
          # Hosted tool-cache directories may grant writes through default ACLs.
          # Match a fresh server without weakening the installer's trust checks.
          for path in /opt /usr/local /usr/local/bin; do
            test -d "$path" && test ! -L "$path"
            stat -c '%U:%G:%a %n' "$path"
            getfacl -cp "$path"
            sudo setfacl --remove-all --remove-default "$path"
            sudo chown root:root "$path"
            sudo chmod go-w "$path"
          done
      - name: Check relay syntax and connection configuration
        run: |
          bash -n deploy/install-aster-relay.sh
          bash -n deploy/aster-capacity-relay
          bash -n deploy/test-aster-relay-systemd.sh
          sudo /usr/bin/python3 -I deploy/test-aster-relay-config.py -v
      - name: Check relay installer boundaries and incremental behavior
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 -I deploy/test-aster-relay-install.py -v
      - name: Verify real systemd installation, TLS, no-op updates and rollback
        if: ${{ !cancelled() }}
        run: sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin AGG_RELAY_DISPOSABLE_CI=1 GITHUB_ACTIONS=true bash deploy/test-aster-relay-systemd.sh

  release-mirror:
    name: Release mirror (real Nginx and verified downloads)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify download reports, configuration and installation recovery
        run: |
          python3 deploy/test-mirror-tools.py -v
          sudo python3 deploy/test-mirror-setup.py -v
      - name: Prepare Nginx for the isolated transport integration
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y nginx
          fi
      - name: Verify redirected asset bytes, cache hits and byte ranges with real Nginx
        run: python3 deploy/test-mirror-nginx.py -v

  release:
    needs: [app, installer, aster-relay, release-mirror]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deployment-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment-package-x64
          path: output/release
      - name: Validate the verified x64 package manifest
        run: python3 deploy/merge-release-manifests.py
      - name: Publish the complete verified deployment package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/publish-release.py
