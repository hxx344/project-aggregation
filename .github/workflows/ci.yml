name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App (Ubuntu 24.04 x64, Node 24.15.0)
    # Match the deployment server: Ubuntu 24.04 LTS / x86_64.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Check and build with immutable dependencies as the service account
        run: sudo env INSTALL_TEST_PACKAGE=1 INSTALL_TEST_NODE="$(command -v node)" INSTALL_TEST_PYTHON="$(command -v python)" bash deploy/test-workspace.sh
      - name: Keep the verified deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-x64
          path: output/release/*
          if-no-files-found: error
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check release download, integrity, extraction and cache boundaries
        run: |
          python3 deploy/test-release.py -v
          python3 deploy/test-publish.py -v
          python3 deploy/test-promote.py -v
          python3 deploy/test-migration.py -v
          python3 deploy/test-package-layout.py -v
      - name: Check installer syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/install-all.sh
          bash -n deploy/test-update-service.sh
          bash -n deploy/test-update-systemd.sh
          bash -n deploy/test-all.sh
          bash -n deploy/test-install.sh
          bash -n deploy/test-environment.sh
          bash -n deploy/test-inputs.sh
          bash -n deploy/test-incremental.sh
          bash -n deploy/test-workspace.sh
      - name: Verify privileged update coordinator and service bootstrap
        run: |
          sudo python3 deploy/test-updater.py -v
          python3 deploy/test-release-cache.py -v
          sudo bash deploy/test-update-service.sh
          sudo env AGG_UPDATER_DISPOSABLE_CI=1 GITHUB_ACTIONS=true bash deploy/test-update-systemd.sh
      - name: Check configuration, atomic activation, cleanup boundaries, and rollback
        run: bash deploy/test-install.sh
      - name: Classify real git inputs including compiler and build environment
        run: bash deploy/test-inputs.sh
      - name: Verify privileged Python dependency provenance
        run: sudo bash deploy/test-python-lock.sh
      - name: Verify incremental changes, isolated validation and recovery
        run: sudo bash deploy/test-incremental.sh
      - name: Verify CI package migration, no-op, integrity and rollback
        run: sudo bash deploy/test-ci-install.sh
      - name: Verify failed configuration changes restore the previous port
        run: bash deploy/test-environment.sh
      - name: Check stack caching, dependency batching, failure recovery and signals
        run: sudo bash deploy/test-all.sh
      - name: Check CI stack preflight and selected release pinning
        run: sudo bash deploy/test-stack-ci.sh

  release:
    needs: [app, installer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deployment-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment-package-x64
          path: output/release
      - name: Validate the verified x64 package manifest
        run: python3 deploy/merge-release-manifests.py
      - name: Publish the complete verified deployment package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/publish-release.py
