name: Docs review gate

# Checks (ci.yml) does not run when every changed file matches these paths.
# The review gate still checks changed lines and commit evidence; there is no
# release candidate for such a commit.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.txt'
      - 'docs/**/*.rst'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.txt'
      - 'docs/**/*.rst'
      - '*.md'

permissions:
  contents: read

jobs:
  hygiene:
    name: Review gate (changed lines)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - name: Check changed lines for review blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test tests/review-gate.test.mjs tests/lessons-routing.test.mjs
          node scripts/review-ci.mjs
