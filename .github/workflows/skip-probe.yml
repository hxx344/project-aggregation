name: Skip probe
on: pull_request
permissions:
  contents: read
jobs:
  a:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  b:
    needs: a
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.a.outputs.x != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  h:
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  c1:
    needs: [b, h]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  c2:
    needs: [b, h]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  c3:
    needs: [b, h]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  c4:
    needs: [b, h]
    if: ${{ !cancelled() && needs.b.result == 'success' && needs.h.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
  c5:
    needs: [b, h]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          STAR: ${{ toJSON(needs.*.result) }}
          F: ${{ contains(needs.*.result, 'failure') }}
          C: ${{ contains(needs.*.result, 'cancelled') }}
          S: ${{ contains(needs.*.result, 'skipped') }}
        run: env | grep -E '^(NEEDS|STAR|F|C|S)=' ; echo "$NEEDS"
  c6:
    needs: [b, h]
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
