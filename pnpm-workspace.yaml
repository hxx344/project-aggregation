packages:
  - 'modules/monitor'
  - 'modules/asset'
  - 'modules/crossex'

# Keep direct dependency declarations in each importer; unify versions here.
catalog:
  '@tailwindcss/postcss': '4.2.1'
  '@types/node': '24.12.0'
  '@types/react': '19.2.14'
  '@types/react-dom': '19.2.3'
  '@vitejs/plugin-react': '6.0.2'
  'class-variance-authority': '0.7.1'
  'clsx': '2.1.1'
  'drizzle-kit': '0.31.10'
  'drizzle-orm': '0.45.2'
  'eslint': '9.39.4'
  'lucide-react': '1.31.0'
  'radix-ui': '^1.6.7'
  'react': '19.2.6'
  'react-dom': '19.2.6'
  'recharts': '3.8.0'
  'tailwind-merge': '3.6.0'
  'tailwindcss': '4.2.1'
  'tw-animate-css': '^1.4.0'
  'typescript': '5.9.3'
  'vite': '8.2.2'
  'ws': '8.21.3'

# Native/build hooks are explicit and reproducible on developer and CI hosts.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  fsevents: false
